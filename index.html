<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Card hover — HTML e CSS</title>


  <link rel="stylesheet" href="estilo.css">
</head>


<body>
  <h1><span>Bel</span> redes sociais</h1>
  <p>Passe o mouse sobre os cartões ou use a tecla Tab.</p>


  <main class="container">


    <article class="card" tabindex="0"
      style="--cor: #242dcf;">
      <div class="frente">
        <span class="icone" aria-hidden="true">in</span>
      </div>


      <div class="verso">
        <h2>Youtube</h2>
        <p>Videos longos para relaxar.</p>
      </div>
    </article>


    <article class="card" tabindex="0"
      style="--cor: #f61f07;">
      <div class="frente">
        <span class="icone" aria-hidden="true">t</span>
      </div>


      <div class="verso">
        <h2>Spotify</h2>
        <p>Ouvir musicas.</p>
      </div>
    </article>


    <article class="card" tabindex="0"
      style="--cor: #3bc934;">
      <div class="frente">
        <span class="icone" aria-hidden="true">&lt;/&gt;</span>
      </div>


      <div class="verso">
        <h2>Tik tok</h2>
        <p>Ver fofocas.</p>
      </div>
    </article>


  </main>
</body>
</html>
